    <!-- JSON-LD: Organization + WebSite. Studio info consumed by Google, Bing,
         DuckDuckGo, Naver (for the Korean audience) and any other schema.org
         parsers. Image is a real 1200px+ brand asset so link previews look right. -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "Organization",
          "@id": "#org",
          "name": "RFG Studio",
          "alternateName": "Rich First Generation Studio",
                    "logo": "https://richardsh3n.github.io/rfg-studio/assets/brand/og-share-card-1200x630.png",
          "image": "https://richardsh3n.github.io/rfg-studio/assets/brand/og-share-card-1200x630.jpg",
          "description": "International commercial photography and film production in Shanghai for global and local brands — retail spaces, corporate events, culture and automotive.",
          "address": {
            "@type": "PostalAddress",
            "addressLocality": "Shanghai",
            "addressCountry": "CN"
          },
          "knowsLanguage": ["en", "zh", "es", "it"]
        },
        {
          "@type": "WebSite",
          "@id": "#site",
                    "name": "RFG Studio",
          "inLanguage": ["en", "zh", "es", "it"],
          "publisher": { "@id": "#org" }
        }
      ]
    }
    </script>
